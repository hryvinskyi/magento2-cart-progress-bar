<div class="cart-progress-bar" data-bind="visible: visible, css: classes">
    <a class="cart-progress-bar__body" data-bind="attr: {href: link() || null, title: terms() || null}">
        <!-- ko if: image -->
        <img class="cart-progress-bar__image" alt="" data-bind="attr: {src: image}"/>
        <!-- /ko -->
        <span class="cart-progress-bar__content">
            <span class="cart-progress-bar__text" data-bind="text: text"></span>
            <span class="cart-progress-bar__track" aria-hidden="true">
                <span class="cart-progress-bar__fill" data-bind="style: {width: percent() + '%'}"></span>
            </span>
        </span>
    </a>
</div>
